[project]
name = "legal-compliance-rag-evals"
version = "0.1.0"
description = "Synthetic legal-compliance RAG demo with a RAGAS evaluation gate."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Muhammad Mustafa" }]
dependencies = [
    "anthropic>=0.40",
    "faiss-cpu>=1.8",
    "langchain>=0.3.27,<0.4",
    "langchain-community>=0.3.27,<0.4",
    "langchain-core>=0.3.70,<0.4",
    "langchain-openai>=0.2.14,<0.4",
    "numpy>=2.0",
    "openai>=1.50",
    "psycopg[binary]>=3.2",
    "pyyaml>=6.0",
    "ragas==0.4.3",
    "rapidfuzz>=3.14.6",
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.7",
    "types-PyYAML>=6.0",
]

[project.scripts]
legal-rag = "legal_rag.cli:main"
legal-rag-eval = "legal_rag.evaluation.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/legal_rag"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["legal_rag"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["legal_rag"]
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "faiss",
    "faiss.*",
    "ragas",
    "ragas.*",
    "anthropic",
    "anthropic.*",
    "sklearn",
    "sklearn.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
