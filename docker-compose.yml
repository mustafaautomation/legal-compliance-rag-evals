services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: legal
      POSTGRES_PASSWORD: legal
      POSTGRES_DB: legalrag
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legal -d legalrag"]
      interval: 5s
      timeout: 5s
      retries: 10
